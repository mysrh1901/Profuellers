<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(20, 10)">
    <!-- Outer shield shape -->
    <path d="M50 8 L90 22 L90 55 C90 78 72 94 50 100 C28 94 10 78 10 55 L10 22 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner shield -->
    <path d="M50 18 L80 29 L80 54 C80 72 66 84 50 89 C34 84 20 72 20 54 L20 29 Z" 
          fill="url(#shield-grad)" opacity="0.12"/>
    <!-- AI brain/circuit inside shield -->
    <circle cx="50" cy="50" r="16" fill="none" stroke="url(#shield-grad)" stroke-width="2" opacity="0.8"/>
    <circle cx="50" cy="50" r="6" fill="url(#shield-grad)" opacity="0.9"/>
    <!-- Neural connections -->
    <line x1="50" y1="34" x2="50" y2="28" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="66" x2="50" y2="72" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="50" x2="28" y2="50" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="50" x2="72" y2="50" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Diagonal connections -->
    <line x1="39" y1="39" x2="34" y2="34" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="61" y1="39" x2="66" y2="34" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="39" y1="61" x2="34" y2="66" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="61" y1="61" x2="66" y2="66" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Small dots at connection ends -->
    <circle cx="50" cy="28" r="2.5" fill="url(#accent-grad)"/>
    <circle cx="50" cy="72" r="2.5" fill="url(#accent-grad)"/>
    <circle cx="28" cy="50" r="2.5" fill="url(#accent-grad)"/>
    <circle cx="72" cy="50" r="2.5" fill="url(#accent-grad)"/>
    <!-- Checkmark overlay -->
    <path d="M40 52 L47 59 L62 42" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- Text: KAVACH -->
  <text x="130" y="62" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="900" fill="#f8fafc" letter-spacing="-1">KAVACH</text>
  <!-- Text: AI -->
  <text x="330" y="62" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="300" fill="url(#shield-grad)" letter-spacing="-1">AI</text>

  <!-- Tagline -->
  <text x="130" y="88" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="1.5">KNOWLEDGE-DRIVEN AUDIT, VULNERABILITY ANALYSIS &amp; COMPLIANCE HEALTH</text>
</svg>
