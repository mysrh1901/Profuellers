<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M50 6 L92 22 L92 52 C92 78 74 94 50 100 C26 94 8 78 8 52 L8 22 Z" 
        fill="none" stroke="url(#sg)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M50 16 L82 28 L82 52 C82 72 68 84 50 90 C32 84 18 72 18 52 L18 28 Z" 
        fill="url(#sg)" opacity="0.1"/>

  <!-- AI brain circle -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="url(#sg)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="50" cy="50" r="8" fill="url(#sg)" opacity="0.9"/>

  <!-- Neural connections -->
  <line x1="50" y1="30" x2="50" y2="22" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="78" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="22" y2="50" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="78" y2="50" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="36" x2="30" y2="30" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="64" y1="36" x2="70" y2="30" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="36" y1="64" x2="30" y2="70" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="64" y1="64" x2="70" y2="70" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Connection dots -->
  <circle cx="50" cy="22" r="3" fill="url(#ag)"/>
  <circle cx="50" cy="78" r="3" fill="url(#ag)"/>
  <circle cx="22" cy="50" r="3" fill="url(#ag)"/>
  <circle cx="78" cy="50" r="3" fill="url(#ag)"/>

  <!-- Checkmark (compliance verified) -->
  <path d="M38 52 L46 60 L64 40" fill="none" stroke="url(#ag)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
